openapi: 3.0.0
info:
  title: CSDB Management System
  description: Managing CSDB Object for aircraft manual development.
  version: "0.0.1"
servers:
  - url: https://techpub.test
    description: development server
  - url: http://127.0.0.1:8000
    description: local development server
tags:
  - name: auth
  - name: csdb
paths:
  /sanctum/csrf-cookie:
    get:
      summary: set csrf to cookie with key XSRF-TOKEN
      responses:
        "200":
          description: OK
  /get/csrf:
    get:
      summary: to get csrf value
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
  /api/login:
    post:
      summary: login path for each user
      tags:
        - auth
      parameters:
        - in: header
          name: "X-DEVICE-NAME"
          example: "WebBrowser"
          description: "to define the access token name"
          schema:
            type: string
        - $ref: "#/components/parameters/xmlhttprequest"
        - $ref: "#/components/parameters/xsrf"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "login success"
                  token_type:
                    type: string
                    example: "Bearer"
                  access_token:
                    type: string
                    example: "1|s8QEnMRDQkRHSO1KqCZm32bvVB1Gi87kxSMvKII14a322e4b"
        "422":
          description: Uncompressable Content
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "login failed"
                  errors:
                    $ref: "#/components/schemas/errors"
        "419":
          $ref: "#/components/responses/Expired"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: "luffy@example.com"
                password:
                  type: string
                  example: password
  /api/auth-check:
    post:
      summary: "to check wheter the user is still authenticate or not"
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/bearerAuthorization"
      responses:
        "200":
          description: "the user is authenticated"
        "401":
          description: "the user is not authenticated"
          $ref: "#/components/responses/Unauthorized"
  /api/logout:
    post:
      summary: logout user for each token obtained at login
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/bearerAuthorization"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "logout success"
        "419":
          $ref: "#/components/responses/Expired"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - auth: []
  /api/s1000d/csdb/create:
    put:
      summary: creating CSDB object.
      description: The client should provide the xml string of csdb object, but it is intended for dmodule, and pm only (icn metafile is coming soon).
      tags:
        - csdb
      parameters:
        - $ref: "#/components/parameters/bearerAuthorization"
      requestBody:
        $ref: "#/components/requestBodies/csdbcreate"
      responses:
        "200":
          $ref: "#/components/responses/csdb_create_success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Failed to created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  infotype:
                    $ref: "#/components/schemas/infotype"
                  message:
                    type: string
                    example: "DMC-S1000D-G-04-10-0301-00A-022A-D_001-00_EN-US.xml is failed to create."
                  csdb:
                    $ref: "#/components/schemas/csdb"
                  errors:
                    $ref: "#/components/schemas/errors"
      security:
        - auth: []
  /api/s1000d/ddn/create:
    put:
      summary: create DDN object
      description: DDN is a part of csdb, but it is not made by xml editor.
      tags:
        - csdb
      parameters:
        - $ref: "#/components/parameters/bearerAuthorization"
      requestBody:
        $ref: "#/components/requestBodies/ddncreate"
      responses:
        "200":
          $ref: "#/components/responses/csdb_create_success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ddn_create_fail_validation"
      security:
        - auth: []
  /api/s1000d/dml/create:
    put:
      summary: create DDN object
      description: DDN is a part of csdb, but it is not made by xml editor.
      tags:
        - csdb
      parameters:
        - $ref: "#/components/parameters/bearerAuthorization"
      requestBody:
        $ref: "#/components/requestBodies/dmlcreate"
      responses:
        "200":
          $ref: "#/components/responses/csdb_create_success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/dml_create_fail_validation"
      security:
        - auth: []
  /api/s1000d/dml/merge/{filename}:
    put:
      summary: merge two or more DML
      description: merging DML will combine all their contents. The DMLs must be an same owner of the requester.
      tags:
        - csdb
      parameters:
        - $ref: "#/components/parameters/bearerAuthorization"
        - in: path
          name: filename
          schema:
            type: string
          required: true
          description: DDN filename
          example: DML-MALE-0001Z-P-2024-00008_000-01.xml
      requestBody:
        $ref: "#/components/requestBodies/dmlmerge"
      responses:
        "200":
          $ref: "#/components/responses/csdb_create_success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/csdbNotFound"
        "422":
          description: Failed to merge
          content:
            application/json:
              schema:
                type: object
                properties:
                  infotype:
                    $ref: "#/components/schemas/infotype"
                  message:
                    type: string
                    example: "Failed to merge"
                  errors:
                    type: object
                    example:
                      sourceModels:
                        type: array
                        items:
                          type: string
                          example: Only DML with type 'P' can be merged.
  /api/s1000d/comment/create:
    put:
      summary: create comment.
      description: create comment.
      tags:
        - csdb
      parameters:
        - $ref: "#/components/parameters/bearerAuthorization"
      requestBody:
        $ref: "#/components/requestBodies/commentcreate"
      responses:
        "200":
          $ref: "#/components/responses/csdb_create_success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Fail processing
          content:
            application/json:
              schema:
                type: object
                required:
                  - infotype
                  - message
                properties:
                  infotype:
                    $ref: "#/components/schemas/infotype"
                  message:
                    type: string
                    example: "Cannot create COM due to duplicate filename."
                  csdb:
                    $ref: "#/components/schemas/csdb"
                  errors:
                    type: object
                    example:
                      brexDmRef:
                        - brexDmRef infocode must be '022'.
                      commentRefs:
                        - commentRefs must contain one type of CSDB object.
                      responseType:
                        - responseType value must be contain 'rt' and suffixed by the two digit number less than 100
                      securityClassification:
                        - securityClassification is required.
        "499":
          description: duplicated csdb
          content:
            application/json:
              schema:
                type: object
                required:
                  - infotype
                  - message
                  - csdb
                properties:
                  infotype:
                    $ref: "#/components/schemas/infotype"
                  message:
                    type: string
                    example: "Cannot create COM due to duplicate filename."
                  csdb:
                    $ref: "#/components/schemas/csdb"
                  errors:
                    type: object
  /api/s1000d/csdb/import/{filename}:
    put:
      summary: "import CSDB object."
      description: The client should provide the filenames which available in ddn content.
      tags:
        - csdb
      parameters:
        - $ref: "#/components/parameters/bearerAuthorization"
        - in: path
          name: filename
          schema:
            type: string
          required: true
          description: DDN filename
          example: DML-MALE-0001Z-P-2024-00008_000-01.xml
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filenames:
                  type: array
                  items:
                    type: string
                  example:
                    - DMC...
                    - PMC...
      responses:
        "200":
          description: Success importing csdb file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  infotype:
                    $ref: "#/components/schemas/infotype"
                  message:
                    type: string
                    example: Success to import xx/xx and fail to import xx/xx.
                  data:
                    $ref: "#/components/schemas/successProcessing"
        "204":
          $ref: "#/components/responses/routeModelBindingNoContent"
        "404":
          $ref: "#/components/responses/csdbNotFound"
        "299":
          description: if any failure and any scucess.
          content:
            application/json:
              schema:
                type: object
                properties:
                  infotype:
                    $ref: "#/components/schemas/infotype"
                  message:
                    type: string
                    example: Success to import xx/xx and fail to import xx/xx.
                  data:
                    $ref: "#/components/schemas/successProcessing"
                  errors:
                    $ref: "#/components/schemas/failureProcessing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Failed to import.;
          content:
            application/json:
              schema:
                type: object
                properties:
                  infotype:
                    $ref: "#/components/schemas/infotype"
                  message:
                    type: string
                    example: "Success to import xx/xx and fail to import xx/xx"
                  data:
                    type: object
                    example:
                      failure:
                        - DMC...
                        - PMC...
                  errors:
                    type: object
                    example:
                      properties:
                        failure:
                          $ref: "#/components/schemas/failureProcessing"
                        dispatchTo:
                          type: array
                          items:
                            type: string
                          example:
                            - DMC...
                            - PMC...
        "499":
          description: duplicated csdb
          content:
            application/json:
              schema:
                type: object
                properties:
                  infotype:
                    $ref: "#/components/schemas/infotype"
                  message:
                    type: string
                    example: "There is none of csdb imported. Some csdb's is prevented to overwrite."
                  errors:
                    $ref: "#/components/schemas/failureProcessing"
      security:
        - auth: []
  /api/s1000d/csdb/read/{filename}:
    get:
      summary: "get the csdb xml file"
      description: "file will be sent as xml string"
      tags:
        - csdb
      parameters:
        - in: path
          name: filename
          schema:
            type: string
          required: true
          description: "filename csdb file in xml"
          example: DML-MALE-0001Z-P-2024-00008_000-01.xml
        - in: query
          name: form
          schema:
            type: string
            enum:
              - json
              - xml
          description: output of the csdb object.
          example: "json"
      responses:
        "200":
          description: "success to load file xml"
          content:
            text/xml:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  csdb:
                    $ref: "#/components/schemas/csdb"
                  json:
                    type: object
                    description: xml file which transformed into json.
        "204":
          $ref: "#/components/responses/routeModelBindingNoContent"
        "404":
          $ref: "#/components/responses/csdbNotFound"
      security:
        - auth: []
  /api/s1000d/ident/{filename}:
    get:
      summary: to get an ident of csdb object.
      description: ICN is has not processed (TBD). The response csdb.ident may not available at all because it is dependent of the type of csdb file.
      tags:
        - csdb
      parameters:
        - in: path
          name: filename
          schema:
            type: string
          required: true
          description: "filename csdb file in xml"
          example: DML-MALE-0001Z-P-2024-00008_000-01.xml
      responses:
        "200":
          description: "success to get ident"
          content:
            application/json:
              schema:
                type: object
                properties:
                  csdb:
                    $ref: "#/components/schemas/csdb_ident"
        "204":
          $ref: "#/components/responses/routeModelBindingNoContent"
        "404":
          $ref: "#/components/responses/csdbNotFound"
  /api/s1000d/status/{filename}:
    get:
      summary: to get an status of csdb object.
      description: ICN is has not processed (TBD). The response csdb.ident may not available at all because it is dependent of the type of csdb file.
      tags:
        - csdb
      parameters:
        - in: path
          name: filename
          schema:
            type: string
          required: true
          description: "filename csdb file in xml"
          example: DML-MALE-0001Z-P-2024-00008_000-01.xml
      responses:
        "200":
          description: "success to get ident"
          content:
            application/json:
              schema:
                type: object
                properties:
                  csdb:
                    $ref: "#/components/schemas/csdb_status"
        "204":
          $ref: "#/components/responses/routeModelBindingNoContent"
        "404":
          $ref: "#/components/responses/csdbNotFound"
  /api/s1000d/histories/{filename}:
    get:
      summary: to get an histories of csdb object.
      description: to get an histories of csdb object.
      tags:
        - csdb
      parameters:
        - in: path
          name: filename
          schema:
            type: string
          required: true
          description: "filename csdb file in xml"
          example: DML-MALE-0001Z-P-2024-00008_000-01.xml
      responses:
        "200":
          description: "success to get histories"
          content:
            application/json:
              schema:
                type: object
                properties:
                  csdb:
                    $ref: "#/components/schemas/csdb_histories"
        "404":
          $ref: "#/components/responses/csdbNotFound"
  /api/s1000d/comments/{filename}:
    get:
      summary: to get an comments of csdb object.
      description: to get an comments of csdb object.
      tags:
        - csdb
      parameters:
        - in: path
          name: filename
          schema:
            type: string
          required: true
          description: "filename csdb file in xml"
          example: DML-MALE-0001Z-P-2024-00008_000-01.xml
      responses:
        "200":
          description: "success to get comments"
          content:
            application/json:
              schema:
                type: object
                properties:
                  csdb:
                    $ref: "#/components/schemas/csdb_comments"
        "404":
          $ref: "#/components/responses/csdbNotFound"
  /api/s1000d/csdb/all:
    get:
      summary: get all csdb and icn object
      description: get all csdb and icn Object
      tags:
        - csdb
      parameters:
        - in: query
          name: stt
          description: query untuk object yang aktif atau yang sudah di delete.
          schema:
            type: string
            enum:
              - dct
              - act
          example: 1
        - in: query
          name: limit
          description: limit the quantity result.
          schema:
            type: string
          example: "10"
        - in: query
          name: sc
          description: query untuk property model/csdb.
          schema:
            type: string
          example: filename::DMC-... (defaultnya filename)
      responses:
        "200":
          description: "Success on queried."
          content:
            application/json:
              schema:
                type: object
                properties:
                  csdbs:
                    $ref: "#/components/schemas/csdb_uri"
  /api/s1000d/path/{path}:
    get:
      summary: get all csdb and icn object by the ath
      description: get all csdb and icn object by the path. If path is prefixed by the 'DISPATCHED', then it will look for the DDN of the dispatched to the client from other clients
      tags:
        - csdb
      parameters:
        - in: path
          name: path
          required: true
          description: path of csdb object
          schema:
            type: string
          example: CSDB/DMC/AMM
        - in: query
          name: stt
          description: query untuk object yang aktif atau yang sudah di delete.
          schema:
            type: string
            enum:
              - dct
              - act
          example: 1
        - in: query
          name: sc
          description: query untuk property model/csdb.
          schema:
            type: string
          example: filename::DMC-... (defaultnya filename)
      responses:
        "200":
          $ref: "#/components/responses/csdb_bypath"
  /api/s1000d/user/search:
    get:
      summary: get all user and icn object
      description: get all user and icn Object
      tags:
        - user
      parameters:
        - in: query
          name: limit
          description: limit the quantity result.
          schema:
            type: string
          example: "10"
        - in: query
          name: sc
          description: query untuk property model/csdb.
          schema:
            type: string
          example: luffy
      responses:
        "200":
          description: "Success on queried."
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        first_name:
                          type: string
                          example: "Luffy"
                        middle_name:
                          type: string
                          example: "Baka"
                        last_name:
                          type: string
                          example: "Sencho"
                        email:
                          type: string
                          example: luffy@example.com
  /api/s1000d/csdb/dispatched:
    get:
      summary: get all ddn dispatched from other users
      description: get all ddn dispatched from other users
      tags:
        - csdb
      parameters:
        - in: query
          name: limit
          description: limit the quantity result.
          schema:
            type: string
          example: "10"
        - in: query
          name: sc
          description: query untuk property model/csdb.
          schema:
            type: string
          example: luffy
      responses:
        "200":
          $ref: "#/components/responses/csdb_dispatched"
  /api/s1000d/csdb/update/{filename}:
    post:
      summary: update the xml file of CSDB object
      description: The request should provide the xml string of csdb object, but it is intended for dmodule, and pm only (icn metafile is coming soon).
      tags:
        - csdb
      parameters:
        - $ref: "#/components/parameters/filename"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                xmleditor:
                  example: <dmodule>...</dmodule>
      responses:
        "200":
          description: Success updating csdb file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  infotype:
                    $ref: "#/components/schemas/infotype"
                  message:
                    type: string
                    example: DMC-S1000D-G-04-10-0301-00A-022A-D_001-00_EN-US.xml has been updated.
                  csdb:
                    $ref: "#/components/schemas/csdb"
        "204":
          $ref: "#/components/responses/routeModelBindingNoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/csdbNotFound"
        "422":
          description: Failed to update.;
          content:
            application/json:
              schema:
                type: object
                properties:
                  infotype:
                    $ref: "#/components/schemas/infotype"
                  message:
                    type: string
                    example: "DMC-S1000D-G-04-10-0301-00A-022A-D_001-00_EN-US.xml is failed to update."
                  csdb:
                    $ref: "#/components/schemas/csdb"
                  errors:
                    $ref: "#/components/schemas/errors"
      security:
        - auth: []
  /api/s1000d/dml/update/{filename}:
    post:
      summary: update dml object
      description: DML is a part of csdb, but it is updated made by xml editor.
      tags:
        - csdb
      parameters:
        - $ref: "#/components/parameters/bearerAuthorization"
      requestBody:
        $ref: "#/components/requestBodies/dmlupdate"
      responses:
        "200": 
          description: Success updating csdb file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  infotype:
                    $ref: "#/components/schemas/infotype"
                  message:
                    type: string
                    example: DML-CN235-0001Z-P-2024-00001_000-01.xml has been updated.
                  csdb:
                    $ref: "#/components/schemas/csdb"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/csdbNotFound"
        "422":
          description: Failed to update.;
          content:
            application/json:
              schema:
                type: object
                properties:
                  infotype:
                    $ref: "#/components/schemas/infotype"
                  message:
                    type: string
                    example: "DMC-S1000D-G-04-10-0301-00A-022A-D_001-00_EN-US.xml is failed to update."
                  csdb:
                    $ref: "#/components/schemas/csdb"
                  errors:
                    $ref: "#/components/schemas/errors"
      security:
        - auth: []
      
  /api/s1000d/csdb/delete:
    delete:
      summary: soft delete csdb file.
      description: the csdb file in storage is still exist and csdb file can be restored. Jika ada yang fail dan ada yang success, maka 299, jika totally fail 400, jika totally success 200.
      tags:
        - csdb
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  description: "multiple filename is supported by separate using delimitter comma."
                  example:
                    $ref: "#/components/examples/data/value/csdb/filename"
      responses:
        "200":
          description: if all's are deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/csdbdelete"
        "299":
          description: if any failure and any scucess.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cesdbdelete_fail"
        "400":
          description: if all's are failed to delete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cesdbdelete_fail"
        "412":
          description: the request body parameters is not provided.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "filename is required"
      security:
        - auth: []
  /api/s1000d/csdb/permanentdelete:
    delete:
      summary: permanent delete csdb file.
      description: the csdb file in storage may still exist but csdb file can not be restored.
      tags:
        - csdb
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  description: "multiple filename is supported by separate using delimitter comma."
                  example:
                    $ref: "#/components/examples/data/value/csdb/filename"
      responses:
        "200":
          $ref: "#/components/responses/csdb_delete"
        "400":
          $ref: "#/components/responses/csdb_delete"
        "412":
          description: the request body parameters is not provided.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "filename is required"
      security:
        - auth: []
  /api/s1000d/csdb/restore:
    post:
      summary: restore the previous deleted csdb file.
      description: the csdb file is restored from the status of deletion.
      tags:
        - csdb
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  description: "multiple filename is supported by separate using delimitter comma."
                  example:
                    $ref: "#/components/examples/data/value/csdb/filename"
      responses:
        "200":
          $ref: "#/components/responses/csdb_delete"
        "400":
          $ref: "#/components/responses/csdb_delete"
        "412":
          description: the request body parameters is not provided.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "filename is required"
      security:
        - auth: []
components:
  schemas:
    brexDmRef:
      type: string
      description: any csdb file with info code 022
