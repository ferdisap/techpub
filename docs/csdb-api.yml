                $ref: "#/components/schemas/infotype"
              message:
                type: string
                example: DMC-S1000D-G-04-10-0301-00A-022A-D_001-00_EN-US.xml has been created.
              csdb:
                $ref: "#/components/schemas/csdb"
    ddn_create_fail_validation:
      description: fail during validation request payload
      content:
        application/json:
          schema:
            type: object
            properties:
              infotype:
                $ref: "#/components/schemas/infotype"
              message:
                type: string
                example: "Fail processing"
              errors:
                type: object
                example:
                  seqNumber:
                    - "Cannot make DDN due to unique filename constrain."
                    - "seqNumber must contain five numeric characters."
                  brexDmRef:
                    - brexDmRef infocode must be '022'.
                  modelIdentCode:
                    - modelIdentCode is required.
                  senderIdent:
                    - senderIdent is required.
                  receiverIdent:
                    - receiverIdent is required.
                  securityClassification:
                    - securityClassification is required.
    dml_create_fail_validation:
      description: fail during validation request payload
      content:
        application/json:
          schema:
            type: object
            properties:
              infotype:
                $ref: "#/components/schemas/infotype"
              message:
                type: string
                example: "Fail processing"
              errors:
                type: object
                example:
                  seqNumber:
                    - "Cannot make DML due to unique filename constrain."
                    - "seqNumber must contain five numeric characters."
                  brexDmRef:
                    - brexDmRef infocode must be '022'.
                  modelIdentCode:
                    - modelIdentCode is required.
                  dmlType:
                    - DML type must be value of 'c','p',or 's'.
                  originator:
                    - The originator must contain five digits alphanumeric or capital letter.
                  securityClassification:
                    - securityClassification is required.
    csdb_dispatched:
      description: "Provide ddn dispatched to the client from other users. Each of csdb uri will be prefixed by the IMPORTED at its path."
      content:
        application/json:
          schema:
            type: object
            properties:
              csdbs:
                $ref: "#/components/schemas/csdb_uri"
    csdb_bypath:
      description: provide all csdb based on the given path with pagination data.
      content:
        application/json:
          schema:
            type: object
            properties:
              path:
                type: string
                description: the current or target request path
                example: CSDB/DMC/AMM
              paths:
                type: array
                description: the sub path of the target request path
                items:
                  type: string
                example:
                  - MALE
                  - N219
              pagination:
                type: object
                properties:
                  current_page:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        filename:
                          type: string
                          example: DMC-MALE-A-00-00-00-00A-00PA-D_000-01_EN-EN.xml
                        path:
                          type: string
                          example: CSDB/DMC/AMM/MALE
                        last_history:
                          type: object
                          properties:
                            code:
                              type: string
                            created_at:
                              type: string
                        access_key:
                          type: object
                          properties:
                            key:
                              type: string
                              example: kqT6ai7hjcqzasl82t4dgg%3D%3D%3A%3Af18fa1f865561dbe3fbdf6e5f8481664
                  first_page_url:
                    type: string
                    example: http://127.0.0.1:8000/api/s1000d/path/csdb/dmc?page=1
                  from:
                    type: integer
                    example: 1
                  last_page:
                    type: integer
                    example: 10
                  last_page_url:
                    type: string
                    example: http://127.0.0.1:8000/api/s1000d/path/csdb/dmc?page=10
                  links:
                    type: array
                    description: used for the next and previous page, array contains three items, previous, current, next
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          nullable: true
                        label:
                          type: string
                          example: "1"
                        active:
                          type: boolean
                          example: true
                    example:
                      - url: "null"
                        label: "< Previous"
                        active: false
                      - url: "http://127.0.0.1:8000/api/s1000d/path/csdb/dmc?page=1"
                        label: "1"
                        active: true
                      - url: "http://127.0.0.1:8000/api/s1000d/path/csdb/dmc?page=2"
                        label: "Next >"
                        active: true
                  next_page_url:
                    type: string
                    nullable: true
                    example: null
                  path:
                    type: string
                    description: current request url path
                    example: http://127.0.0.1:8000/api/s1000d/path/csdb/dmc
                  per_page:
                    type: integer
                    example: 100
                  prev_page_url:
                    type: string
                    nullable: true
                    example: null
                  to:
                    type: integer
                    example: 10
                  total:
                    type: integer
                    example: 10
                    description: total of page
  securitySchemes:
    auth:
      type: http
      scheme: bearer
  parameters:
    xmlhttprequest:
      name: "X-Requested-With"
      description: header for request by using XML HTTP Request
      in: header
      required: true
      schema:
        type: string
