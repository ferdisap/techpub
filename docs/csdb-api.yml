                    - "changed"
                    - "deleted"
                    - "revised"
                    - "status"
                    - "reinstate-changed"
                    - "reinstate-revised"
                    - "reinstate-status"
                example: 
                  - ""
                  - "new"
              securityClassification:
                type: array
                items: 
